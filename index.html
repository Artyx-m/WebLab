<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Объявления — ЛГТУ">
  <title>Объявления — ЛГТУ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header" aria-label="Главное меню">
      <picture class="header-art">
        <source media="(max-width: 599px)" srcset="assets/header-mobile.svg">
        <source media="(max-width: 1024px)" srcset="assets/header-tablet.svg">
        <img src="assets/header-desktop.svg" alt="Объявления. Регистрация. Вход.">
      </picture>
      <div class="header-user-state" id="headerUserState" hidden><span id="headerGreeting">Здравствуйте, Константин</span><button type="button" id="logoutButton">Выход</button></div>
      <button class="header-hotspot register-hotspot" data-open-modal="register" aria-label="Регистрация"></button>
      <button class="header-hotspot login-hotspot" data-open-modal="login" aria-label="Вход"></button>
    </header>

    <section class="listings-section" aria-label="Новые объявления">
      <div class="section-heading">
        <picture class="title-art">
          <source media="(max-width: 599px)" srcset="assets/title-mobile.svg">
          <source media="(max-width: 1024px)" srcset="assets/title-tablet.svg">
          <img src="assets/title-desktop.svg" alt="Новые объявления">
        </picture>
        <a class="add-link" href="add.html" aria-label="Добавить объявление">
          <picture>
            <source media="(max-width: 599px)" srcset="assets/button-add-mobile.svg">
            <source media="(max-width: 1024px)" srcset="assets/button-add-tablet.svg">
            <img src="assets/button-add-desktop.svg" alt="Добавить объявление">
          </picture>
        </a>
      </div>

      <div class="cards-grid" id="cardsGrid" aria-label="Объявления"></div>
      <div class="more-button-wrap">
        <button class="more-button" id="loadMore" type="button" aria-label="Показать ещё">
          <picture>
            <source media="(max-width: 599px)" srcset="assets/button-more-mobile.svg">
            <source media="(max-width: 1024px)" srcset="assets/button-more-tablet.svg">
            <img src="assets/button-more-desktop.svg" alt="Показать ещё">
          </picture>
        </button>
      </div>
      <p class="load-status" id="loadStatus" aria-live="polite"></p>
    </section>

    <footer class="site-footer">
      <picture>
        <source media="(max-width: 599px)" srcset="assets/footer-mobile.svg">
        <source media="(max-width: 1024px)" srcset="assets/footer-tablet.svg">
        <img src="assets/footer-desktop.svg" alt="">
      </picture>
    </footer>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModal" aria-label="Закрыть">×</button>
      <div class="modal-tabs" role="tablist" aria-label="Учётная запись">
        <button class="modal-tab active" data-tab="register" role="tab">Регистрация</button>
        <button class="modal-tab" data-tab="login" role="tab">Авторизация</button>
      </div>
      <h2 id="modalTitle" class="visually-hidden">Регистрация</h2>
      <form id="registerForm" class="account-form">
        <input name="name" autocomplete="name" placeholder="Ваше имя" aria-label="Ваше имя" required pattern="[А-Яа-яЁё\s-]+">
        <div class="form-row">
          <input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" required>
          <input name="phone" type="tel" autocomplete="tel" placeholder="Мобильный телефон" aria-label="Мобильный телефон" required pattern="[+0-9()\s-]{10,20}">
        </div>
        <div class="form-row">
          <input name="password" type="password" autocomplete="new-password" placeholder="Пароль" aria-label="Пароль" minlength="6" required>
          <input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Повторите пароль" aria-label="Повторите пароль" minlength="6" required>
        </div>
        <label class="consent"><input type="checkbox" name="consent" required><span>Согласен на обработку <a href="#personal-data">персональных данных</a></span></label>
        <p class="form-note">Все поля обязательны для заполнения</p>
        <button class="submit-button" type="submit">Зарегистрироваться</button>
      </form>
      <form id="loginForm" class="account-form" hidden>
        <input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" required>
        <input name="password" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required>
        <p class="form-note">Все поля обязательны для заполнения</p>
        <button class="submit-button" type="submit">Войти</button>
      </form>
      <p class="form-status" id="formStatus" aria-live="polite"></p>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
