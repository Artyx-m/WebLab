<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Объявление — ЛГТУ</title><link rel="stylesheet" href="styles.css"></head><body><main class="page-shell"><header class="site-header" aria-label="Главное меню"><picture class="header-art"><source media="(max-width:599px)" srcset="assets/header-mobile.svg"><source media="(max-width:1024px)" srcset="assets/header-tablet.svg"><img src="assets/header-desktop.svg" alt="Объявления. Регистрация. Вход."></picture><div class="header-user-state" id="headerUserState" hidden><span id="headerGreeting">Здравствуйте, Константин</span><button type="button" id="logoutButton">Выход</button></div><button class="header-hotspot register-hotspot" data-open-modal="register" aria-label="Регистрация"></button><button class="header-hotspot login-hotspot" data-open-modal="login" aria-label="Вход"></button></header><section class="detail-wrap" id="detail"></section><p><a class="text-link" href="index.html">← К объявлениям</a></p><footer class="site-footer"><picture><source media="(max-width:599px)" srcset="assets/footer-mobile.svg"><source media="(max-width:1024px)" srcset="assets/footer-tablet.svg"><img src="assets/footer-desktop.svg" alt=""></picture></footer></main><div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="closeModal" aria-label="Закрыть">×</button><div class="modal-tabs" role="tablist" aria-label="Учётная запись"><button class="modal-tab active" data-tab="register" role="tab">Регистрация</button><button class="modal-tab" data-tab="login" role="tab">Авторизация</button></div><h2 id="modalTitle" class="visually-hidden">Регистрация</h2><form id="registerForm" class="account-form"><input name="name" autocomplete="name" placeholder="Ваше имя" required pattern="[А-Яа-яЁё\s-]+"><div class="form-row"><input name="email" type="email" autocomplete="email" placeholder="Email" required><input name="phone" type="tel" autocomplete="tel" placeholder="Мобильный телефон" required pattern="[+0-9()\s-]{10,20}"></div><div class="form-row"><input name="password" type="password" autocomplete="new-password" placeholder="Пароль" minlength="6" required><input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Повторите пароль" minlength="6" required></div><label class="consent"><input type="checkbox" name="consent" required><span>Согласен на обработку персональных данных</span></label><button class="submit-button" type="submit">Зарегистрироваться</button></form><form id="loginForm" class="account-form" hidden><input name="email" type="email" autocomplete="email" placeholder="Email" required><input name="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="submit-button" type="submit">Войти</button></form><p class="form-status" id="formStatus" aria-live="polite"></p></section></div><script src="app.js"></script><script src="detail.js"></script></body></html>
